################################################################################
# te_semantics.conf -- type enforcement / access vector semantics.
#
# Hand written policy source for the sego query tests.  Every declaration below
# exists to make one construct independently searchable:
#
#   * source and target criteria matched directly and through attributes
#     (multi-member attribute, a type that is a member of two attributes, an
#     attribute used as a rule source in some rules and as a rule target in
#     others)
#   * regular expression name matching for sources and targets
#   * list and regular expression class criteria (two classes for each)
#   * permission criteria in any / equal / subset modes
#   * type_transition / type_change / type_member with concrete defaults
#   * conditionals over several Booleans, exercising &&, ||, !, nesting and
#     setools' right-operand-first rendering order, including a dontaudit
#   * neverallow / neverallowxperm assertions (never written to the binary)
#
# The symbol names are descriptive rather than positional: a name states what
# the symbol demonstrates.  Compiled by policy/testdata/gen.sh with
# `checkpolicy -c {30,32,33,35} -M -U reject`.
################################################################################

#
# Object classes.
#
class flow
class flow_extra
class c_alpha
class c_beta
class c_gamma1
class c_gamma2

sid kernel
sid security

common flow_perm
{
	read_low
	read_med
	read_high
	write_low
	write_med
	write_high
}

# flow carries only the shared permissions.
class flow inherits flow_perm

# flow_extra adds the permissions used by the permission set criteria.
class flow_extra inherits flow_perm
{
	grant_all
	grant_read
	grant_none
	grant_both
	grant_extra
}

# c_alpha and c_beta form the "class list" criterion pair; c_alpha has a
# permission of its own, c_beta only the shared ones.
class c_alpha
{
	noop
}

class c_beta inherits flow_perm

# c_gamma1 and c_gamma2 are matched together by the "class regex" criterion.
class c_gamma1 inherits flow_perm
class c_gamma2 inherits flow_perm

#
# MLS declarations (the policies are built with -M).
#
sensitivity s0;
sensitivity s1;

dominance { s0 s1 }

category c0;

level s0:c0;
level s1:c0;

mlsconstrain flow write_high ((l1 dom l2) or (t1 == mls_exempt));

attribute mls_exempt;

type system;
role system;
role system types system;

################################################################################
# Source criteria
################################################################################

# Direct match: the rule source is the attribute itself.
attribute src_direct;
type src_direct_member, src_direct;
type src_direct_other, src_direct;
type tgt_direct;

allow src_direct tgt_direct:flow read_high;
allow src_direct_other src_direct_other:flow read_high;

# Indirect match: the criterion is the member type, the rule names the
# attribute.
attribute src_indirect;
type src_indirect_member, src_indirect;
type tgt_indirect;

allow src_indirect tgt_indirect:flow read_high;

# Direct regular expression match: only src_re_a_ok and src_re_a_skip match the
# pattern; only src_re_a_ok has a rule.
attribute src_re_a_ok;
attribute src_re_a_skip;
attribute src_re_b;
type src_re_a_member, src_re_a_ok;
type src_re_a_skip_member, src_re_a_skip;
type tgt_re;

allow src_re_a_ok tgt_re:flow write_low;
allow src_re_b tgt_re:flow read_med;

# Indirect regular expression match: the pattern matches the member types, the
# rules name their attributes.
attribute attr_pair_s;
attribute attr_pair_t;
type pair_s_member, attr_pair_s;
type pair_t_member, attr_pair_t;

allow attr_pair_s attr_pair_s:flow read_high;
allow attr_pair_t attr_pair_t:flow write_low;

################################################################################
# Target criteria
################################################################################

# Direct match: the rule target is the attribute itself.
attribute tgt_direct_attr;
type tgt_direct_member, tgt_direct_attr;
type src_for_tgt_direct;

allow src_for_tgt_direct tgt_direct_attr:flow read_high;
allow src_for_tgt_direct tgt_direct_member:flow read_high;

# Indirect match: the criterion is the member type, the rule may name the
# attribute or the member.
attribute tgt_indirect_attr;
type tgt_indirect_member, tgt_indirect_attr;
type src_for_tgt_indirect;

allow src_for_tgt_indirect tgt_indirect_attr:flow read_high;
allow src_for_tgt_indirect tgt_indirect_member:flow write_low;

# Direct regular expression match.
attribute tgt_re_a_ok;
attribute tgt_re_a_skip;
attribute tgt_re_b;
type tgt_re_member, tgt_re_a_ok;
type src_for_tgt_re;

allow src_for_tgt_re tgt_re_member:flow read_high;
allow src_for_tgt_re tgt_re_a_ok:flow write_low;
allow src_for_tgt_re tgt_re_b:flow read_med;

# Indirect regular expression match.
attribute tgt_pair_s;
attribute tgt_pair_t;
type tgtpair_s_member, tgt_pair_s;
type tgtpair_t_member, tgt_pair_t;
type src_for_tgt_pair;

allow src_for_tgt_pair tgt_pair_s:flow read_high;
allow src_for_tgt_pair tgt_pair_t:flow write_low;

################################################################################
# Class criteria
################################################################################

type class_list_t;
allow class_list_t class_list_t:flow read_high;
allow class_list_t class_list_t:c_beta read_high;
allow class_list_t class_list_t:c_alpha noop;

type class_re_t;
allow class_re_t class_re_t:flow read_high;
allow class_re_t class_re_t:c_gamma1 write_low;
allow class_re_t class_re_t:c_gamma2 read_med;

################################################################################
# Permission criteria (any / equal / subset)
################################################################################

type perm_any_single;
type perm_any_pair;
allow perm_any_single perm_any_single:flow_extra grant_read;
allow perm_any_pair perm_any_pair:flow_extra { grant_read grant_none };

type perm_eq_one;
type perm_eq_two;
type perm_eq_three;
type perm_eq_four;
allow perm_eq_one perm_eq_one:flow_extra grant_all;
allow perm_eq_two perm_eq_two:flow_extra { grant_all grant_none };
allow perm_eq_three perm_eq_three:flow_extra { grant_all grant_none grant_both };
allow perm_eq_four perm_eq_four:flow_extra { grant_all grant_none grant_both grant_extra };

################################################################################
# Rule type criteria
################################################################################

type ruletype_t;
auditallow ruletype_t ruletype_t:flow_extra grant_both;
dontaudit ruletype_t ruletype_t:flow_extra grant_extra;

################################################################################
# Type transition / change / member defaults
################################################################################

type trans_src;
type trans_default;
type_transition trans_src trans_src:flow_extra trans_default;

type trans_pair_src;
type trans_pair_d;
type trans_pair_e;
type_transition trans_pair_src trans_pair_d:flow_extra trans_pair_e;
type_transition trans_pair_src trans_pair_e:flow_extra trans_pair_d;

type change_src;
type change_tgt;
type change_default;
type_change change_src change_tgt:flow change_default;

type member_src;
type member_tgt;
type member_default;
type_member member_src member_tgt:flow member_default;

################################################################################
# Conditional rules
################################################################################

type bool_a_t1;
type bool_a_t2;
bool c_one false;
bool c_two true;
if (c_one) {
	allow bool_a_t1 bool_a_t1:flow_extra grant_all;
}
if (c_one && c_two) {
	allow bool_a_t2 bool_a_t2:flow_extra grant_all;
}

type bool_b_t1;
type bool_b_t2;
bool c_three false;
bool c_four true;
if (c_three) {
	allow bool_b_t1 bool_b_t1:flow_extra grant_all;
}
if (c_four) {
	allow bool_b_t2 bool_b_t2:flow_extra grant_all;
}
if (c_three && c_four) {
	allow bool_b_t1 bool_b_t1:flow_extra grant_extra;
}

type bool_c_t1;
type bool_c_t2;
bool c_five false;
bool c_six true;
bool c_seven true;
if (c_five) {
	allow bool_c_t1 bool_c_t1:flow_extra grant_none;
}
if (c_seven) {
	allow bool_c_t2 bool_c_t2:flow_extra grant_both;
}
if (c_seven || c_six) {
	allow bool_c_t2 bool_c_t2:flow_extra grant_extra;
}

# A dontaudit inside a conditional block.
type bool_d_t1;
bool c_eight false;
if (c_eight) {
	allow bool_d_t1 bool_d_t1:flow_extra grant_all;
	dontaudit bool_d_t1 bool_d_t1:flow_extra grant_extra;
}

################################################################################
# Attribute matching (a type in two attributes, attributes used as source and
# target)
################################################################################

attribute attr_overlap_a;
attribute attr_overlap_b;
type in_both, attr_overlap_a, attr_overlap_b;
type only_b, attr_overlap_b;
type only_a, attr_overlap_a;
type overlap_target;

allow attr_overlap_a overlap_target:flow_extra read_high;
allow in_both in_both:flow_extra write_high;
allow only_b only_b:flow_extra read_med;
allow attr_overlap_b overlap_target:flow_extra grant_all;

################################################################################
# neverallow assertions (must never be written to the binary policy)
################################################################################

neverallow only_a overlap_target:flow_extra grant_both;

################################################################################
# Users and label tables
################################################################################

user u_system roles system level s0 range s0 - s1:c0;

sid kernel u_system:system:system:s0
sid security u_system:system:system:s0

fs_use_xattr ext4 u_system:system:system:s0;
fs_use_task pipefs u_system:system:system:s0;
fs_use_trans devpts u_system:system:system:s0;

genfscon proc / u_system:system:system:s0

portcon tcp 80 u_system:system:system:s0

netifcon eth0 u_system:system:system:s0 u_system:system:system:s0

nodecon 127.0.0.1 255.255.255.255 u_system:system:system:s0
nodecon ::1 ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff u_system:system:system:s0
