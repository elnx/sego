################################################################################
# xperm.conf -- extended permission (allowxperm / auditallowxperm /
#               dontauditxperm / neverallowxperm) semantics.
#
# Every construct the extended permission query tests exercise is present:
#
#   * an ioctl single value, a multi-value range (rendered without braces) and
#     two disjoint ranges (rendered with braces)
#   * nlmsg extended permissions on a netlink class
#   * source matching direct / indirect / regular expression
#   * target matching indirect
#   * a class list criterion over two classes that both carry the ioctl
#     permission
#   * auditallowxperm / dontauditxperm rules
#   * neverallow / neverallowxperm assertions (never written to the binary)
#
# Compiled by policy/testdata/gen.sh with
# `checkpolicy -c {30,32,33,35} -M -U reject`.
################################################################################

#
# Object classes.
#
class flow
class flow_extra
class c_alpha
class c_beta
class c_gamma1
class c_gamma2
class nl_iface

sid kernel
sid security

common flow_perm
{
	read_low
	read_med
	read_high
	write_low
	write_med
	write_high
	ioctl
}

# flow carries the shared permissions, including the ioctl permission that the
# ioctl extended permission rules attach to.
class flow inherits flow_perm

# c_alpha and c_beta both carry ioctl (one directly, one through the common)
# and make up the "class list" extended permission criterion.
class c_alpha
{
	ioctl
}

class c_beta inherits flow_perm

class c_gamma1 inherits flow_perm
class c_gamma2 inherits flow_perm

class flow_extra inherits flow_perm
{
	grant_all
	grant_read
	grant_none
	grant_both
	grant_extra
}

# nl_iface carries the nlmsg permission that nlmsg extended permission rules
# attach to.
class nl_iface
{
	nlmsg
}

#
# MLS declarations (the policies are built with -M).
#
sensitivity s0;
sensitivity s1;

dominance { s0 s1 }

category c0;

level s0:c0;
level s1:c0;

mlsconstrain flow write_high ((l1 dom l2) or (t1 == mls_exempt));

attribute mls_exempt;

type system;
role system;
role system types system;

# Plain rule so the permission used by the standard-permission xperm test
# exists outside of extended permission rules too.
allow system system:c_alpha ioctl;

################################################################################
# Source criteria
################################################################################

# Direct match: the rule source is the attribute itself.
attribute src_xperm;
type src_xperm_member, src_xperm;
type tgt_xperm_direct;
type src_xperm_other, src_xperm;

allowxperm src_xperm tgt_xperm_direct:flow ioctl { 0xebe0-0xebff };
allowxperm src_xperm_other src_xperm_other:flow ioctl { 0x8800-0x88ff };

# Indirect match: the criterion is the member type, the rule names the
# attribute.
attribute attr_xperm_ind;
type src_xperm_ind, attr_xperm_ind;
type tgt_xperm_ind;

allowxperm attr_xperm_ind tgt_xperm_ind:flow ioctl { 0x5411 0x5451 };

# Direct regular expression match.
attribute src_rex_ok;
attribute src_rex_skip;
attribute src_rex_other;
type tgt_rex;

allowxperm src_rex_ok tgt_rex:flow ioctl 0x1111;
allowxperm src_rex_other tgt_rex:flow ioctl 0x5555;

# Indirect regular expression match.
attribute attr_px_s;
attribute attr_px_t;
type px_s_member, attr_px_s;
type px_t_member, attr_px_t;

allowxperm attr_px_s attr_px_s:flow ioctl 0x9999;
allowxperm attr_px_t attr_px_t:flow ioctl 0x1111;

################################################################################
# Target criteria
################################################################################

# Indirect match.
attribute attr_xperm_tgt;
type src_xperm_tgt;
type tgt_xperm_member, attr_xperm_tgt;

allowxperm src_xperm_tgt attr_xperm_tgt:flow ioctl 0x9999;
allowxperm src_xperm_tgt tgt_xperm_member:flow ioctl 0x1111;

################################################################################
# Class criterion
################################################################################

type class_list_t;
allowxperm class_list_t class_list_t:c_beta ioctl 0x9999;
allowxperm class_list_t class_list_t:c_alpha ioctl 0x0000;

################################################################################
# nlmsg extended permissions
################################################################################

attribute src_nlmsg;
type src_nlmsg_member, src_nlmsg;
type tgt_nlmsg;

allowxperm src_nlmsg tgt_nlmsg:nl_iface nlmsg { 0x01-0xf1 };

################################################################################
# XPerm set comparison (overlap / exact)
################################################################################

type xperm_range_a;
type xperm_range_b;
type xperm_range_c;
type xperm_range_d;

allowxperm xperm_range_a xperm_range_a:flow_extra ioctl 0x9011;
allowxperm xperm_range_b xperm_range_b:flow_extra ioctl { 0x9011-0x9012 };
allowxperm xperm_range_c xperm_range_c:flow_extra ioctl { 0x9011-0x9013 };
allowxperm xperm_range_d xperm_range_d:flow_extra ioctl { 0x9011-0x9014 };

################################################################################
# Rule type criterion
################################################################################

type ruletype_x_t;
auditallowxperm ruletype_x_t ruletype_x_t:flow_extra ioctl 0x1234;
dontauditxperm ruletype_x_t ruletype_x_t:flow_extra ioctl 0x4321;

################################################################################
# neverallow assertions (must never be written to the binary policy)
################################################################################

type neverallow_src;
type neverallow_tgt;

neverallow neverallow_src neverallow_tgt:flow_extra { ioctl read_high };
neverallowxperm neverallow_src neverallow_tgt:flow_extra ioctl 0xcccc;

################################################################################
# Users and label tables
################################################################################

user u_system roles system level s0 range s0 - s1:c0;

sid kernel u_system:system:system:s0
sid security u_system:system:system:s0

fs_use_xattr ext4 u_system:system:system:s0;
fs_use_task pipefs u_system:system:system:s0;

genfscon proc / u_system:system:system:s0

portcon tcp 80 u_system:system:system:s0

netifcon eth0 u_system:system:system:s0 u_system:system:system:s0

nodecon 127.0.0.1 255.255.255.255 u_system:system:system:s0
