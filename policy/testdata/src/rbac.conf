################################################################################
# rbac.conf -- role allow and role transition semantics.
#
# Every construct the RBAC query tests exercise is present:
#
#   * role allow rules with direct and regular expression source matching
#   * role_transition rules with a role target and with a type target
#   * class list and class regular expression criteria over role_transition
#     rules (two classes each)
#   * default role criteria, direct and regular expression
#   * the legacy class-less role_transition form, which libsepol stores against
#     the process class
#
# Compiled by policy/testdata/gen.sh with
# `checkpolicy -c {30,32,33,35} -M -U reject`.
################################################################################

#
# Object classes.
#
class flow
class flow_extra
class c_alpha
class c_beta
class c_gamma1
class c_gamma2
class process

sid kernel
sid security

common flow_perm
{
	read_low
	read_med
	read_high
	write_low
	write_med
	write_high
}

class flow inherits flow_perm

# c_alpha and c_beta make up the "class list" criterion.
class c_alpha
{
	noop
}

class c_beta inherits flow_perm

# c_gamma1 and c_gamma2 make up the "class regex" criterion.
class c_gamma1 inherits flow_perm
class c_gamma2 inherits flow_perm

class flow_extra inherits flow_perm
{
	grant_all
	grant_read
	grant_none
	grant_both
	grant_extra
}

# The process class is required by the legacy class-less role_transition.
class process inherits flow_perm
{
	transition
}

#
# MLS declarations (the policies are built with -M).
#
sensitivity s0;
sensitivity s1;

dominance { s0 s1 }

category c0;

level s0:c0;
level s1:c0;

mlsconstrain flow write_high ((l1 dom l2) or (t1 == mls_exempt));

attribute mls_exempt;

type system;
role system;
role system types system;

# Plain rule so the policy has an access vector entry.
allow system system:c_alpha noop;

################################################################################
# Role allow and role_transition rules
################################################################################

# Source direct.
role role_out_d;
role role_in_d;
allow role_out_d role_in_d;
role_transition role_out_d system:flow role_in_d;

# Source regular expression: only role_re_a and role_re_b match the pattern,
# only role_re_a has an allow rule.
role role_re_a;
role role_re_b;
role role_re_c;
role role_re_t;
allow role_re_a role_re_t;
role_transition role_re_c system:flow role_re_t;

# Target role direct.
role role_out_t;
role role_in_t;
allow role_out_t role_in_t;
role_transition role_out_t system:flow role_in_t;

# Target role regular expression.
role role_tre_s;
role role_tre_a;
role role_tre_b;
role role_tre_c;
allow role_tre_s role_tre_a;
role_transition role_tre_s system:flow role_tre_c;

# Target type.
role role_typt_s;
type type_typt;
role role_typt_d;
allow role_typt_s role_typt_d;
role_transition role_typt_s type_typt:flow role_typt_d;

# Class list criterion.
role role_cls;
role role_cls_d1;
role role_cls_d2;
role role_cls_d3;
role_transition role_cls system:flow role_cls_d1;
role_transition role_cls system:c_beta role_cls_d2;
role_transition role_cls system:c_alpha role_cls_d3;

# Class regular expression criterion.
role role_crx;
role role_crx_d1;
role role_crx_d2;
role role_crx_d3;
role_transition role_crx system:flow role_crx_d1;
role_transition role_crx system:c_gamma1 role_crx_d2;
role_transition role_crx system:c_gamma2 role_crx_d3;

# Default role direct.
role role_def_s;
role role_def_d;
allow role_def_s role_def_d;
role_transition role_def_s system:flow role_def_d;

# Default role regular expression.
role role_defr_s;
role role_defr_1;
role role_defr_2;
role role_defr_3;
allow role_defr_s role_defr_1;
allow role_defr_s role_defr_2;
allow role_defr_s role_defr_3;
role_transition role_defr_s system:flow role_defr_1;
role_transition role_defr_s system role_defr_2;
role_transition role_defr_s system:flow_extra role_defr_3;

################################################################################
# Users and label tables
################################################################################

user u_system roles system level s0 range s0 - s1:c0;

sid kernel u_system:system:system:s0
sid security u_system:system:system:s0

fs_use_xattr ext4 u_system:system:system:s0;
fs_use_task pipefs u_system:system:system:s0;

genfscon proc / u_system:system:system:s0

portcon tcp 80 u_system:system:system:s0

netifcon eth0 u_system:system:system:s0 u_system:system:system:s0

nodecon 127.0.0.1 255.255.255.255 u_system:system:system:s0
