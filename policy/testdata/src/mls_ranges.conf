################################################################################
# mls_ranges.conf -- range_transition rule semantics.
#
# Every construct the MLS query tests exercise is present:
#
#   * a single level, a low/high sensitivity range and a category range level
#   * source matching direct, regular expression and through attributes
#   * target matching direct
#   * a class list criterion
#   * the range shapes compared by the overlap / subset / superset (and proper)
#     modes: a rule range that a criterion can overlap, contain, be contained
#     by, equal on one end only, or fail to relate to at all
#
# Compiled by policy/testdata/gen.sh with
# `checkpolicy -c {30,32,33,35} -M -U reject`.
################################################################################

#
# Object classes.
#
class flow
class flow_extra
class c_alpha
class c_beta

sid kernel
sid security

common flow_perm
{
	read_low
	read_med
	read_high
	write_low
	write_med
	write_high
}

class flow inherits flow_perm
class flow_extra inherits flow_perm
{
	grant_all
	grant_read
	grant_none
	grant_both
	grant_extra
}

# c_alpha and c_beta make up the "class list" criterion.
class c_alpha
{
	noop
}

class c_beta inherits flow_perm

#
# MLS declarations.
#
sensitivity s0;
sensitivity s1;
sensitivity s2;
sensitivity s3;
sensitivity s40;
sensitivity s41;
sensitivity s42;
sensitivity s43;
sensitivity s44;
sensitivity s45;
sensitivity s46;

dominance { s0 s1 s2 s3 s40 s41 s42 s43 s44 s45 s46 }

category c0;
category c1;
category c2;
category c3;
category c4;

level s0:c0.c4;
level s1:c0.c4;
level s2:c0.c4;
level s3:c0.c4;
level s40:c0.c4;
level s41:c0.c4;
level s42:c0.c4;
level s43:c0.c4;
level s44:c0.c4;
level s45:c0.c4;
level s46:c0.c4;

mlsconstrain flow write_high ((l1 dom l2) or (t1 == mls_exempt));

attribute mls_exempt;

type system;
role system;
role system types system;

# Plain rule so the policy has an access vector entry.
allow system system:c_alpha noop;

################################################################################
# Range transition rules
################################################################################

# Source direct.
type mls_src;
type mls_tgt;
range_transition mls_src mls_tgt:flow s0;

# Range shapes beyond the comparison fixtures.
type range_lowhigh;
range_transition range_lowhigh range_lowhigh:flow s0 - s1:c0;

type range_cat;
range_transition range_cat range_cat:flow s2:c0.c3;

# Source regular expression: src_re_plain and the attribute src_re_a match the
# pattern, and src_re_a has src_re_plain as its only member, so both matching
# rules name src_re_plain in the binary policy.
attribute src_re_a;
attribute src_re_skip;
type src_re_plain, src_re_a;
type src_re_skip_member, src_re_skip;
type src_re_tgt;

range_transition src_re_plain src_re_tgt:flow s1;
range_transition src_re_a src_re_tgt:flow_extra s2;
range_transition src_re_skip src_re_tgt:flow s3;

# Source attribute (indirect): the criterion is the attribute, the rules name
# its member types.
attribute src_attr_a;
attribute src_attr_b;
type mls_in_both, src_attr_a, src_attr_b;
type mls_only_b, src_attr_b;
type mls_attr_tgt;

range_transition mls_in_both mls_attr_tgt:flow s1;
range_transition mls_only_b mls_attr_tgt:flow_extra s2;

# Target direct.
type src_for_tgt;
type mls_tgt2;
range_transition src_for_tgt mls_tgt2:flow s0;
range_transition src_for_tgt mls_tgt2:flow_extra s1;

# Class list criterion.
type mls_cls;
range_transition mls_cls mls_cls:flow s0;
range_transition mls_cls mls_cls:c_alpha s2;
range_transition mls_cls mls_cls:c_beta s1;

# Exact range match.
type range_exact;
range_transition range_exact range_exact:flow s40:c1 - s40:c0.c4;

# Range comparison shapes.
type range_overlap;
range_transition range_overlap range_overlap:flow s41:c1 - s41:c1.c3;

type range_subset;
range_transition range_subset range_subset:flow s42:c1 - s42:c1.c3;

type range_superset;
range_transition range_superset range_superset:flow s43:c1 - s43:c1.c3;

type range_proper_subset;
range_transition range_proper_subset range_proper_subset:flow s44:c1 - s44:c1.c3;

type range_proper_super;
range_transition range_proper_super range_proper_super:flow s45:c1 - s45:c1.c3;

################################################################################
# Users and label tables
################################################################################

user u_system roles system level s0 range s0 - s46:c0.c4;

sid kernel u_system:system:system:s0
sid security u_system:system:system:s0

fs_use_xattr ext4 u_system:system:system:s0;
fs_use_task pipefs u_system:system:system:s0;

genfscon proc / u_system:system:system:s0

portcon tcp 80 u_system:system:system:s0

netifcon eth0 u_system:system:system:s0 u_system:system:system:s0

nodecon 127.0.0.1 255.255.255.255 u_system:system:system:s0
