################################################################################
# non_mls.conf -- a small policy compiled WITHOUT -M.
#
# Used to check that a policy whose MLS support is disabled still parses and
# answers type enforcement queries: the kernel policy stores the range of every
# context even without MLS, so this exercises the empty level encoding.
#
# Compiled by policy/testdata/gen.sh (no -M) with
# `checkpolicy -c 32 -U reject`.
################################################################################

class flow
class flow_extra

sid kernel
sid security

common flow_perm
{
	read_low
	read_med
	read_high
	write_low
	write_med
	write_high
}

class flow inherits flow_perm
class flow_extra inherits flow_perm
{
	grant_all
	grant_read
	grant_none
	grant_both
	grant_extra
}

attribute domain;

type system, domain;
role system;
role system types system;

allow system system:flow read_high;

user system roles system;

sid kernel system:system:system
sid security system:system:system

fs_use_xattr ext4 system:object_r:system;
fs_use_task pipefs system:object_r:system;
fs_use_trans devpts system:object_r:system;

genfscon proc / system:object_r:system

portcon tcp 80 system:system:system

netifcon eth0 system:object_r:system system:object_r:system

nodecon 127.0.0.1 255.255.255.255 system:object_r:system
