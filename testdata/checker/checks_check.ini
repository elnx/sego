[te_exec]
check_type = assert_te
desc = Assert good_t can execute exec_t.
tclass = file
perms = execute
expect_source = good_t
expect_target = exec_t

[te_secret]
check_type = assert_te
desc = Assert nobody can write exec_t.
tclass = file
perms = write
exempt_source = bad_t

[ro_execs]
check_type = ro_execs
desc = Verify that executables are read-only.

[ro_execs_exempt]
check_type = ro_execs
exempt_write_domain = bad_t
exempt_file = lib_t
exempt_exec_domain = loader_t

[ro_kmods]
check_type = ro_kmods

[rbac]
check_type = assert_rbac
source = rr1
expect_source = rr1
expect_target = rr1
