[te_allow]
check_type = assert_te
desc = Assert app_t can read data_t files.
tclass = file
perms = read
expect_source = app_t
expect_target = data_t

[te_exempt]
check_type = assert_te
desc = Assert no rule grants write access except the exempt source.
tclass = file
perms = write
exempt_source = app_t

[rbac]
check_type = assert_rbac
source = r_admin
expect_source = r_admin
expect_target = r_ops

[empty_attr]
check_type = empty_typeattr
desc = Verify that the data_attr attribute is empty.
attr = data_attr

[missing_attr]
check_type = empty_typeattr
attr = nosuch_attr
missing_ok = True

[ro_execs]
check_type = ro_execs
desc = Verify that executables are read-only.

[ro_execs_exempt]
check_type = ro_execs
exempt_write_domain = bad_t
exempt_file = lib_t
exempt_exec_domain = loader_t

[ro_kmods]
check_type = ro_kmods

[disabled]
check_type = assert_te
disable = not needed in this build
tclass = file
