################################################################################
# sego_test.conf -- main sesearch test policy for the sego project.
#
# Hand written policy.conf source.  Every declaration below exists to make one
# construct of the sesearch query matrix independently searchable:
#
#   * plain allow / auditallow / dontaudit rules, on concrete types and on type
#     attributes (multi-member attribute, a type in two attributes, an attribute
#     used as source in some rules and as target in others, self rule)
#   * type_transition / type_change / type_member (concrete and attribute source)
#   * filename type transitions (two names, one name with two source types)
#   * role allow / role_transition (class specific variants, role attribute)
#   * range_transition (single level, s1-s3 range, s1:c0.c3 category range)
#   * conditionals over four Booleans (&&, ||, !, nested parens, else block)
#   * extended permissions (ioctl single / range / disjoint ranges); the nlmsg
#     extended permissions live in sego_nlmsg.conf (see testdata/README.md)
#   * classes with and without a common, permissions unique to one class
#   * neverallow / neverallowxperm rules (they must not reach the binary policy)
#
# Compiled by testdata/gen.sh with `checkpolicy -c {30,32,33,35} -M -U reject`.
################################################################################

#
# Object classes.  Two commons are declared: "file_common" is inherited by
# file/dir/chr_file, "sock_common" by socket/netlink_socket.  Class "process"
# has no common at all, and several permissions (ioctl, nlmsg, search, fork)
# exist in exactly one class.
#
class file
class dir
class chr_file
class process
class socket
class netlink_socket

sid kernel
sid security
sid unlabeled

common file_common
{
	read
	write
	lock
}

common sock_common
{
	recv
	send
}

class file inherits file_common

class dir inherits file_common
{
	search
	open
}

# chr_file is the only class carrying the "ioctl" permission, which is the
# permission an ioctl allowxperm rule is attached to.
class chr_file inherits file_common
{
	ioctl
}

class process
{
	fork
	transition
	sigchld
	sigkill
}

class socket inherits sock_common
{
	connect
	accept
}

# netlink_socket carries the "nlmsg" permission used by nlmsg allowxperm rules.
class netlink_socket inherits sock_common
{
	nlmsg
}

#
# MLS declarations (the policies are built with -M).
#
sensitivity s0;
sensitivity s1;
sensitivity s2;
sensitivity s3;

dominance { s0 s1 s2 s3 }

category c0;
category c1;
category c2;
category c3;

level s0:c0;
level s1:c0.c3;
level s2:c0.c3;
level s3:c0.c3;

# The mls section must contain at least one constraint.
mlsconstrain file { read write } (l1 dom l2);
mlsconstrain dir { search open } (l1 domby l2);
mlsvalidatetrans file (l1 eq l2 and u1 == u2 and r1 == r2);

#
# Types and type attributes.
#
#   domain       -- source attribute with three member types
#   data_attr    -- target attribute with three member types
#   special_attr -- log_t is in both data_attr and special_attr; the attribute
#                   itself is used as a rule source and as a rule target
#   legacy_attr  -- expanded attribute: rules naming it are expanded at compile
#                   time, so the attribute is not a member of anything in the
#                   binary policy
#
attribute domain;
attribute data_attr;
attribute special_attr;
attribute legacy_attr;

type app_t, domain;
type server_t, domain;
type client_t, domain;
type data_t, data_attr;
type log_t, data_attr, special_attr;
type config_t, special_attr;
type default_t;
type plain_t;
type legacy_t, legacy_attr;

typealias app_t alias app_alias;

expandattribute legacy_attr true;

#
# Roles, role attribute and role allow rules.
#
attribute_role r_attr;
role r_admin;
role r_ops, r_attr;
role r_user;

role r_admin types { app_t plain_t };
role r_ops types { server_t };
role r_user types { client_t };

# role_allow rules (role -> role), including one via a role attribute.
allow r_admin r_user;
allow r_admin r_ops;
allow r_user r_attr;

#
# Booleans used by the conditional rules.
#
bool c_alpha true;
bool c_beta false;
bool c_gamma true;
bool c_delta false;

################################################################################
# 1. Plain TE rules: allow / auditallow / dontaudit, concrete and attribute based
################################################################################

allow app_t data_t:file { read write };
allow client_t log_t:chr_file ioctl;
allow server_t config_t:process fork;
allow client_t data_t:netlink_socket nlmsg;
allow app_t self:process sigchld;

# attribute as source, attribute as target
allow domain data_attr:file read;
allow plain_t special_attr:file write;
# attribute as source in this rule, attribute as target in the rule above
allow special_attr data_t:dir { search open };
# expanded attribute: becomes a per-type rule in the binary policy
allow legacy_attr data_t:file lock;

auditallow client_t log_t:file lock;
auditallow domain special_attr:dir search;
auditallow app_t data_t:process transition;

dontaudit app_t config_t:file write;
dontaudit domain data_attr:chr_file lock;
dontaudit server_t plain_t:socket { connect accept };

################################################################################
# 2. Type transition / change / member rules
################################################################################

type_transition app_t data_t:process default_t;
type_transition domain data_t:file default_t;
type_transition client_t log_t:socket default_t;

type_change app_t data_t:file default_t;
type_change domain log_t:dir default_t;

type_member app_t data_t:process default_t;
type_member domain config_t:file default_t;

################################################################################
# 3. Filename type transitions
#
#    "sego_shared" is used by two different source types: at policy version 33
#    and later this is stored in the compressed filename transition table.
################################################################################

type_transition app_t data_t:file default_t "sego_app_only";
type_transition app_t data_t:file default_t "sego_shared";
type_transition server_t data_t:file plain_t "sego_shared";

################################################################################
# 4. Role transitions
################################################################################

role_transition r_admin app_t r_ops;
role_transition r_user app_t r_ops;
# same source/target/default, three different classes
role_transition r_ops data_t:file r_admin;
role_transition r_ops data_t:dir r_admin;
role_transition r_ops data_t:process r_admin;
# attribute source type, explicit default role
role_transition r_ops special_attr:file r_user;

################################################################################
# 5. Range transitions
################################################################################

range_transition app_t data_t:file s1;
range_transition app_t data_t:dir s1 - s3;
range_transition app_t data_t:process s1:c0.c3;
range_transition domain data_t:socket s1:c1.c2;

################################################################################
# 6. Conditionals
################################################################################

if (c_alpha && !c_beta) {
	allow app_t data_t:process sigchld;
	allow app_t log_t:file { read write };
	allow client_t config_t:dir search;
	dontaudit app_t plain_t:file write;
}

if ((c_gamma || c_delta) && c_alpha) {
	allow server_t data_t:dir open;
	allow server_t log_t:file read;
}

if (!(c_beta || c_delta)) {
	allow client_t log_t:dir search;
} else {
	allow client_t log_t:dir open;
}

if (c_beta || c_gamma) {
	allow app_t config_t:socket connect;
}

################################################################################
# 7. Extended permissions
################################################################################

allowxperm app_t data_t:chr_file ioctl 0x5401;
allowxperm client_t log_t:chr_file ioctl { 0x0000-0x00ff };
allowxperm server_t config_t:chr_file ioctl { 0x1000-0x1010 0x2000-0x2005 };
allowxperm domain plain_t:chr_file ioctl 0x5404;

auditallowxperm app_t data_t:chr_file ioctl 0x5402;

dontauditxperm client_t data_t:chr_file ioctl 0x5403;

################################################################################
# 9. neverallow / neverallowxperm
#
#    These are assertions checked by checkpolicy; none of them may be satisfied
#    by the rules above.  They are not written to the binary policy.
################################################################################

neverallow plain_t config_t:file read;
neverallow { client_t server_t } log_t:chr_file write;
neverallowxperm plain_t data_t:chr_file ioctl 0x1234;

################################################################################
# Users (must be declared after the TE/RBAC declarations)
################################################################################

user u_admin roles { r_admin r_ops } level s1 range s1 - s3:c0.c3;
user u_user roles r_user level s0 range s0 - s2:c0.c1;
user u_system roles { r_admin r_ops r_user } level s0 range s0 - s3:c0.c3;

################################################################################
# Initial SID contexts and a few label tables
################################################################################

sid kernel u_system:r_admin:app_t:s0
sid security u_system:r_admin:app_t:s0
sid unlabeled u_system:r_admin:plain_t:s0

fs_use_xattr ext4 u_system:r_admin:plain_t:s0;
fs_use_task pipefs u_system:r_admin:app_t:s0;
fs_use_trans devpts u_system:r_admin:plain_t:s0;

portcon tcp 1111 u_system:r_ops:server_t:s0
portcon tcp 2222-2224 u_system:r_ops:server_t:s0

nodecon 127.0.0.1/32 u_system:r_admin:app_t:s0
nodecon 10.0.0.0/8 u_system:r_admin:app_t:s0
