class file
class dir
class process

sid kernel
sid security
sid unlabeled

common file_common
{
	read
	write
	lock
}

class file inherits file_common
{
	ioctl
}
class dir
{
	search
	open
}
class process
{
	fork
	transition
	sigchld
}

default_user file target;
default_role file target;
default_type file source;
default_range file source high;

sensitivity s0;
sensitivity s1;
dominance { s0 s1 }
category c0;
category c1;
category c2;
level s0;
level s1:c0.c1;
mlsconstrain file { read write } (l1 dom l2);

attribute domain;
attribute data_attr;

type app_t, domain;
type data_t, data_attr;
type plain_t;
type log_t;
type child_t;

typealias app_t alias { app_alias app_alias2 };
typealias child_t alias kid_alias;

typebounds app_t child_t;
permissive plain_t;

policycap open_perms;

allow app_t data_t:file { read write };
allow app_t self:process fork;
allow domain data_attr:file read;

allowxperm app_t data_t:file ioctl { 0x5401 0x5403 };

type_transition app_t data_t:process log_t;
type_change app_t data_t:file plain_t;
type_member app_t data_t:process plain_t;

attribute_role r_attr;
role r_admin;
role r_ops, r_attr;
role r_user;
role r_admin types { app_t plain_t };
role r_ops types { data_t };

allow r_admin r_user;
role_transition r_admin app_t r_ops;
role_transition r_ops data_t:file r_user;
role_transition r_ops data_t:dir r_user;

range_transition app_t data_t:file s0 - s1;
range_transition app_t data_t:dir s0 - s1;

bool c_one false;
bool c_three true;
bool c_two false;

if (c_one && !c_two) {
	auditallow app_t log_t:file write;
} else {
	dontaudit app_t log_t:file write;
}

user u_admin roles { r_admin } level s0 range s0 - s0;
user u_user roles r_user level s0 range s0 - s1:c0;

constrain file write (u1 == u2);
constrain dir { open search } (t1 != { data_t });
validatetrans file (u1 == u2 and r1 == r2);

sid kernel u_admin:r_admin:app_t:s0
sid security u_admin:r_admin:app_t:s0
sid unlabeled u_admin:r_admin:plain_t:s0

fs_use_xattr ext4 u_admin:r_admin:app_t:s0;
fs_use_task pipefs u_admin:r_admin:app_t:s0;
genfscon proc /sys u_admin:r_admin:plain_t:s0
genfscon sysfs / u_admin:r_admin:app_t:s0
genfscon proc /sys/fs -d u_admin:r_admin:app_t:s0
portcon tcp 80 u_admin:r_admin:app_t:s0
portcon tcp 6000-6020 u_admin:r_admin:app_t:s0
netifcon eth0 u_admin:r_admin:plain_t:s0 u_admin:r_admin:app_t:s0
nodecon 10.0.0.0/16 u_admin:r_admin:app_t:s0
nodecon 127.0.0.1/32 u_admin:r_admin:plain_t:s0
ibpkeycon fe80:: 0x0004-0x0008 u_admin:r_admin:plain_t:s0
ibendportcon mlx5_0 1 u_admin:r_admin:plain_t:s0

