class file
class process
class system

sid kernel
sid security
sid unlabeled

class file
{
	read
	write
	append
	execute
	execute_no_trans
	entrypoint
}
class process
{
	transition
}
class system
{
	module_load
}

sensitivity s0;
dominance { s0 }
level s0;
mlsconstrain file read (l1 dom l2);

attribute domain;
type good_t, domain;
type bad_t, domain;
type loader_t, domain;
type exec_t;
type lib_t;
type kmod_t;

allow good_t exec_t:file { read execute };
allow bad_t exec_t:file { read write };
allow good_t lib_t:file { read execute execute_no_trans };
allow loader_t kmod_t:system module_load;
allow bad_t kmod_t:file write;

role rr1;
role rr1 types { good_t bad_t loader_t };

user uu1 roles rr1 level s0 range s0;

sid kernel uu1:rr1:good_t:s0
sid security uu1:rr1:good_t:s0
sid unlabeled uu1:rr1:good_t:s0
