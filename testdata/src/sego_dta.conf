class file
class process

sid kernel
sid security
sid unlabeled

class file
{
	read
	write
	execute
	entrypoint
}
class process
{
	fork
	transition
	dyntransition
	setexec
	setcurrent
	sigchld
}

sensitivity s0;
dominance { s0 }
level s0;
mlsconstrain file { read } (l1 dom l2);

attribute domain;
attribute file_type;

type a_t, domain;
type b_t, domain;
type c_t, domain;
type ep1_t, file_type;
type ep2_t, file_type;
type exec_t;
type plain_t;

allow a_t b_t:process transition;
allow b_t c_t:process transition;
allow a_t c_t:process transition;
allow a_t ep1_t:file execute;
allow b_t ep1_t:file entrypoint;
allow b_t ep2_t:file entrypoint;
allow c_t ep2_t:file entrypoint;
allow b_t ep2_t:file execute;
type_transition a_t ep1_t:process b_t;
type_transition b_t ep2_t:process c_t;
type_transition a_t ep2_t:process c_t;
allow a_t self:process setexec;
allow b_t self:process setexec;

allow a_t plain_t:process dyntransition;
allow a_t self:process setcurrent;

allow a_t self:process fork;
allow plain_t b_t:process transition;
allow plain_t ep1_t:file execute;
type_transition plain_t ep1_t:process b_t;
allow plain_t self:process setexec;

role rr1;
role rr1 types { a_t b_t c_t plain_t };

user uu1 roles rr1 level s0 range s0;

sid kernel uu1:rr1:a_t:s0
sid security uu1:rr1:a_t:s0
sid unlabeled uu1:rr1:a_t:s0
