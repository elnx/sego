################################################################################
# extra_cond_xperm.conf -- extended permissions inside a conditional block.
#
# Extended permissions in conditional policies are only representable from
# policy version 34 on (POLICYDB_VERSION_COND_XPERMS), so this source is only
# compiled at version 35 (see testdata/gen.sh).  checkpolicy rejects it at
# version 30/32/33 with:
#
#   ERROR 'unknown permission nlmsg ... extended permissions in conditional
#          policies are only supported since ...'
#
# The reference oracle /usr/bin/sesearch 4.2.2 cannot read the resulting policy
# either (it stops at policy version 32), so the golden output for this fixture
# is recorded with the locally built setools 4.8 CLI; see testdata/README.md.
################################################################################

class chr_file
class netlink_socket

sid kernel
sid security

common file_common
{
	read
	write
}

class chr_file inherits file_common
{
	ioctl
}

class netlink_socket
{
	nlmsg
}

#
# MLS declarations (the policies are built with -M).
#
sensitivity s0;

dominance { s0 }

category c0;

level s0:c0;

mlsconstrain chr_file { read } (l1 dom l2);

#
# Types, roles and booleans.
#
attribute domain;

type app_t, domain;
type server_t, domain;
type data_t;

bool c_cond_xperm true;
bool c_cond_xperm_off false;

role r_admin;
role r_ops;

role r_admin types { app_t data_t };
role r_ops types { server_t data_t };

#
# Plain rule: a policy whose avtab would be empty is rejected by libsepol
# ("avtab must contain at least one entry").
#
allow app_t data_t:chr_file read;
allow app_t data_t:netlink_socket nlmsg;

#
# Conditional extended permissions (policy version 34+).
#
if (c_cond_xperm && !c_cond_xperm_off) {
	allowxperm app_t data_t:chr_file ioctl 0x5401;
	allowxperm app_t data_t:netlink_socket nlmsg { 0x0001-0x0002 };
}

if (c_cond_xperm_off) {
	allowxperm server_t data_t:chr_file ioctl 0x5402;
} else {
	dontauditxperm server_t data_t:chr_file ioctl 0x5403;
}

#
# Users and label tables.
#
user u_system roles { r_admin r_ops } level s0 range s0;

sid kernel u_system:r_admin:app_t:s0
sid security u_system:r_admin:app_t:s0
