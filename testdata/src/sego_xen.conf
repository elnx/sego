class xen
class domain
class mmu
class hvm

sid xen
sid dom0
sid domxen
sid domio
sid unlabeled
sid security
sid irq
sid iomem
sid ioport
sid device
sid domU
sid domDM

class xen
{
	read
	write
}
class domain
{
	create
}
class mmu
{
	map_read
	map_write
}
class hvm
{
	getparam
}

type xen_t;
type dom0_t;
type domU_t;

role object_r;
role rr1;
allow dom0_t self:xen read;
role rr1 types { xen_t dom0_t domU_t };

user system roles rr1;

sid xen system:object_r:xen_t
sid dom0 system:object_r:dom0_t
sid domxen system:object_r:xen_t
sid domio system:object_r:xen_t
sid unlabeled system:object_r:xen_t
sid security system:object_r:xen_t
sid irq system:object_r:xen_t
sid iomem system:object_r:xen_t
sid ioport system:object_r:xen_t
sid device system:object_r:xen_t
sid domU system:object_r:domU_t
sid domDM system:object_r:domU_t

iomemcon 0x0001 system:object_r:xen_t
ioportcon 0x0011 system:object_r:xen_t
pcidevicecon 0x0001 system:object_r:dom0_t
pirqcon 4 system:object_r:xen_t
devicetreecon /xen system:object_r:xen_t
