################################################################################
# sego_nlmsg.conf -- extended permissions on netlink socket classes.
#
# This is a second, deliberately small source file: the reference oracle used
# for the golden outputs (/usr/bin/sesearch 4.2.2, linked against libsepol 3.0)
# cannot decode *nlmsg* extended permissions at all -- it aborts with
# "Unknown extended permission: 3" on any policy containing them.  The nlmsg
# coverage therefore lives in its own policy, compiled at the same policy
# versions as sego_test.conf, and its golden outputs are recorded with the
# setools 4.8 CLI built from the workspace tree (see testdata/README.md).
#
# Compiled by testdata/gen.sh with `checkpolicy -c {30,32,33,35} -M -U reject`.
################################################################################

class file
class netlink_socket

sid kernel
sid security

common nl_common
{
	recv
	send
}

class file
{
	read
	write
}

# Only class carrying the "nlmsg" permission, which is the permission an nlmsg
# allowxperm rule is attached to.
class netlink_socket inherits nl_common
{
	nlmsg
}

#
# MLS declarations (the policies are built with -M).
#
sensitivity s0;
sensitivity s1;

dominance { s0 s1 }

category c0;

level s0:c0;
level s1:c0;

mlsconstrain netlink_socket { recv send } (l1 dom l2);

#
# Types, attribute, role and boolean.
#
attribute domain;

type app_t, domain;
type server_t, domain;
type data_t;

bool c_nlmsg true;

role r_admin;
role r_ops;

role r_admin types app_t;
role r_ops types server_t;

#
# Plain rule so the nlmsg permission is exercised outside of xperm rules too.
#
allow app_t data_t:file { read write };
allow app_t data_t:netlink_socket { nlmsg recv send };

#
# Extended permissions: single value, range (one run), two disjoint values
# (two runs), attribute source, plus the audit/dontaudit/neverallow variants.
#
allowxperm app_t data_t:netlink_socket nlmsg 0x0009;
allowxperm domain data_t:netlink_socket nlmsg { 0x0001-0x0002 };
allowxperm server_t data_t:netlink_socket nlmsg { 0x0010 0x0020 };

auditallowxperm app_t data_t:netlink_socket nlmsg { 0x0005 0x0007 };
auditallowxperm server_t data_t:netlink_socket nlmsg 0x0042;

dontauditxperm server_t data_t:netlink_socket nlmsg 0x000b;

# Assertion only, never written to the binary policy; no rule above grants it.
neverallowxperm app_t data_t:netlink_socket nlmsg 0x00ff;

#
# Conditional (the boolean is used by a conditional rule, not by an xperm rule:
# extended permissions inside a conditional need policy version 34 or later,
# see extra_cond_xperm.conf).
#
if (c_nlmsg) {
	allow app_t data_t:file read;
}

#
# Users and label tables.
#
user u_system roles { r_admin r_ops } level s0 range s0 - s1:c0;

sid kernel u_system:r_admin:app_t:s0
sid security u_system:r_admin:app_t:s0

fs_use_xattr ext4 u_system:r_admin:app_t:s0;
